<!DOCTYPE html>
<html>
<head>
  <title>Agrosmart Dashboard</title>
  <style>
    body { font-family: Arial; background:#f0f2f5; text-align:center; }
    .card { background:white; padding:20px; margin:30px auto; width:300px; border-radius:10px; box-shadow:0 4px 6px rgba(0,0,0,0.1); }
    button { padding:10px; background:#2e7d32; color:white; border:none; border-radius:5px; cursor:pointer; margin-top:10px; }
  </style>
</head>
<body>

<h2>🌾 Agrosmart Dashboard</h2>

<!-- 🌿 Disease Detection -->
<div class="card">
  <h3>Plant Disease Detection</h3>
  <input type="file" id="plantImage" accept="image/*">
  <button id="detectBtn">Detect</button>
  <p id="diseaseResult">Upload image to detect disease</p>
</div>
<!-- 🌱 Fertilizer Section -->
<div class="card">
  <h3>Recommended Fertilizers</h3>
  <button onclick="showFertilizers()">Show Fertilizers</button>

  <div id="fertilizerSection" style="display:none; margin-top:10px;">
    <ul style="text-align:left;">
      <li>Urea</li>
      <li>DAP (Di-Ammonium Phosphate)</li>
      <li>NPK (20-20-20)</li>
      <li>MOP (Muriate of Potash)</li>
      <li>SSP (Single Super Phosphate)</li>
      <li>Vermicompost</li>
    </ul>
    <button onclick="hideFertilizers()">Close</button>
  </div>
</div>


<!-- 🚪 Logout Button -->
<button onclick="logout()">Logout</button>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
  import { getAuth, signOut, onAuthStateChanged } 
  from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";
  import * as tf from "https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js";

  const firebaseConfig = {
    apiKey:"AIzaSyAh_U5RAoady0tC2EUrQE9531gRnxomNh4",
    authDomain: "agro-smart-660a6.firebaseapp.com",
    projectId: "agro-smart-660a6",
    storageBucket: "agro-smart-660a6.appspot.com",
    messagingSenderId: "578949679343",
    appId: "1:578949679343:web:3b301f2544a7c339c9331a"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  // 🔐 Protect Dashboard
  onAuthStateChanged(auth, (user) => {
    if (!user) {
      window.location.href = "index.html";
    }
  });

  // 🚪 Logout Function
  window.logout = async function () {
    await signOut(auth);
    window.location.href = "index.html";
  };

  // 🌿 AI MODEL
  const MODEL_URL = "model/model.json";
  const CLASSES = ["Healthy", "Early Blight", "Late Blight", "Leaf Mold"];

  let model = null;

  async function loadModel() {
    const resultEl = document.getElementById("diseaseResult");
    try {
      resultEl.innerText = "Loading AI model...";
      model = await tf.loadLayersModel(MODEL_URL);
      resultEl.innerText = "Model loaded ✅";
    } catch (err) {
      resultEl.innerText = "❌ Model not loaded";
      console.log(err);
    }
  }

  loadModel();

  document.getElementById("detectBtn").addEventListener("click", async () => {
    const fileInput = document.getElementById("plantImage");
    const resultEl = document.getElementById("diseaseResult");

    if (!fileInput.files[0]) {
      resultEl.innerText = "❌ Upload image first";
      return;
    }

    if (!model) {
      resultEl.innerText = "❌ Model not loaded";
      return;
    }

    const img = document.createElement("img");
    img.src = URL.createObjectURL(fileInput.files[0]);

    img.onload = async () => {
      const tensor = tf.browser.fromPixels(img)
        .resizeNearestNeighbor([224,224])
        .toFloat()
        .div(tf.scalar(255))
        .expandDims(0);

      const prediction = model.predict(tensor);
      const classIndex = prediction.argMax(-1).dataSync()[0];

      resultEl.innerText = "Prediction: " + (CLASSES[classIndex] || "Unknown");
    };
  });
</script>

</body>
</html>
